<figure class="diagram minw-560" data-routes data-autoplay="5200" aria-label="Four agent engines share one backend">
  <p class="svg-scroll-hint" aria-hidden="true">Drag the drawing sideways to see all of it.</p>
      <div class="diagram-stage">
    <svg class="dg" viewBox="0 0 900 380" role="img" aria-labelledby="eng-svg-t eng-svg-d">
      <title id="eng-svg-t">Four engines, one backend</title>
      <desc id="eng-svg-d">native, react, llamaindex and openai-agents each connect to LLMBackend, one shared description of the OVMS connection, which talks to the same OVMS server.</desc>
      <defs>
        <marker id="ah-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker>
      </defs>
      <path id="ew-native" class="wire" d="M260 52 C312 52 296 178 346 178" marker-end="url(#ah-e)"/>
      <path id="ew-react" class="wire" d="M260 140 C306 140 302 186 346 186" marker-end="url(#ah-e)"/>
      <path id="ew-llama" class="wire" d="M260 228 C306 228 302 194 346 194" marker-end="url(#ah-e)"/>
      <path id="ew-oai" class="wire" d="M260 316 C312 316 296 202 346 202" marker-end="url(#ah-e)"/>
      <path id="ew-b" class="wire" d="M580 190 H646" marker-end="url(#ah-e)"/>

      <g id="e-native" class="node"><rect class="box" x="20" y="20" width="240" height="64" rx="12"/><text class="t-k" x="40" y="44">agent/loop.py</text><text class="t-t" x="40" y="72">native</text></g>
      <g id="e-react" class="node"><rect class="box" x="20" y="108" width="240" height="64" rx="12"/><text class="t-k" x="40" y="132">LangChain</text><text class="t-t" x="40" y="160">react</text></g>
      <g id="e-llama" class="node"><rect class="box" x="20" y="196" width="240" height="64" rx="12"/><text class="t-k" x="40" y="220">LlamaIndex</text><text class="t-t" x="40" y="248">llamaindex</text></g>
      <g id="e-oai" class="node"><rect class="box" x="20" y="284" width="240" height="64" rx="12"/><text class="t-k" x="40" y="308">OpenAI Agents SDK</text><text class="t-t" x="40" y="336">openai-agents</text></g>
      <g id="e-be" class="node"><rect class="box" x="350" y="140" width="230" height="100" rx="12"/><text class="t-k" x="370" y="170">providers/backend.py</text><text class="t-t" x="370" y="200">LLMBackend</text><text class="t-s" x="370" y="222">one shared description</text></g>
      <g id="e-ov" class="node"><rect class="box" x="650" y="140" width="230" height="100" rx="12"/><text class="t-k" x="670" y="170">the same server</text><text class="t-t" x="670" y="200">OVMS /v3</text><text class="t-s" x="670" y="222">same model, same tools</text></g>
    </svg>
  </div>
  <div class="diagram-side">
    <div class="diagram-controls">
      <div class="seg" role="tablist" aria-label="Pick an engine">
        <button type="button" role="tab" id="et-native" aria-controls="ep-native" aria-selected="true" data-wires="ew-native ew-b" data-lanes="ew-native>ew-b>!ew-b>!ew-native" data-on="e-native e-be e-ov"><code>native</code></button>
        <button type="button" role="tab" id="et-react" aria-controls="ep-react" aria-selected="false" tabindex="-1" data-wires="ew-react ew-b" data-lanes="ew-react>ew-b>!ew-b>!ew-react" data-on="e-react e-be e-ov"><code>react</code></button>
        <button type="button" role="tab" id="et-llama" aria-controls="ep-llama" aria-selected="false" tabindex="-1" data-wires="ew-llama ew-b" data-lanes="ew-llama>ew-b>!ew-b>!ew-llama" data-on="e-llama e-be e-ov"><code>llamaindex</code></button>
        <button type="button" role="tab" id="et-oai" aria-controls="ep-oai" aria-selected="false" tabindex="-1" data-wires="ew-oai ew-b" data-lanes="ew-oai>ew-b>!ew-b>!ew-oai" data-on="e-oai e-be e-ov"><code>openai-agents</code></button>
      </div>
        <button class="ctl motion-ctl" type="button" data-act="motion" aria-pressed="false"><svg data-icon="pause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><svg data-icon="play" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" hidden><path d="M4 2.5v11l9-5.5z"/></svg><span class="lbl">Pause motion</span></button>
    </div>
    <div class="engine-detail" id="ep-native" role="tabpanel" aria-labelledby="et-native">
      <div class="code"><pre><code><span class="k">agent:</span>
  <span class="k">type:</span> <span class="s">native</span></code></pre></div>
      <dl>
        <dt>What</dt><dd>OVAT's own loop in <code>agent/loop.py</code>. No extra library.</dd>
        <dt>Run</dt><dd><code>--native</code></dd>
        <dt>Install</dt><dd>Included in <code>pip install ovat</code></dd>
        <dt>Tokens</dt><dd>The only engine that records token counts per turn.</dd>
      </dl>
    </div>
    <div class="engine-detail" id="ep-react" role="tabpanel" aria-labelledby="et-react" hidden>
      <div class="code"><pre><code><span class="k">agent:</span>
  <span class="k">type:</span> <span class="s">react</span></code></pre></div>
      <dl>
        <dt>What</dt><dd>LangChain's <code>create_agent</code> with a <code>ChatOpenAI</code> model pointed at OVMS.</dd>
        <dt>Run</dt><dd><code>--react</code> or <code>--langchain</code></dd>
        <dt>Install</dt><dd><code>pip install "ovat[langchain]"</code></dd>
        <dt>Tokens</dt><dd>Not recorded. Shown as a dash, never as 0.</dd>
      </dl>
    </div>
    <div class="engine-detail" id="ep-llama" role="tabpanel" aria-labelledby="et-llama" hidden>
      <div class="code"><pre><code><span class="k">agent:</span>
  <span class="k">type:</span> <span class="s">llamaindex</span></code></pre></div>
      <dl>
        <dt>What</dt><dd>LlamaIndex's <code>FunctionAgent</code> with an <code>OpenAILike</code> model. Both <code>is_chat_model</code> and <code>is_function_calling_model</code> must be set, or it quietly stops calling tools.</dd>
        <dt>Run</dt><dd><code>--llamaindex</code></dd>
        <dt>Install</dt><dd><code>pip install "ovat[llamaindex]"</code></dd>
        <dt>Tokens</dt><dd>Not recorded.</dd>
      </dl>
    </div>
    <div class="engine-detail" id="ep-oai" role="tabpanel" aria-labelledby="et-oai" hidden>
      <div class="code"><pre><code><span class="k">agent:</span>
  <span class="k">type:</span> <span class="s">openai-agents</span></code></pre></div>
      <dl>
        <dt>What</dt><dd>The OpenAI Agents SDK, kept on your machine by three settings: an explicit client on the <code>/v3</code> URL, the Chat Completions model, and tracing turned off.</dd>
        <dt>Run</dt><dd><code>--openai-agents</code> or <code>--openai-sdk</code></dd>
        <dt>Install</dt><dd><code>pip install "ovat[openai-agents]"</code></dd>
        <dt>Tokens</dt><dd>Not recorded.</dd>
      </dl>
    </div>
  </div>
</figure>
